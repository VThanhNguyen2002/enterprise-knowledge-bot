version: '3.8'

services:
  # FastAPI Backend Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: enterprise-kb-backend
    ports:
      - "8000:8000"
    environment:
      - FASTAPI_HOST=0.0.0.0
      - FASTAPI_PORT=8000
      - LOG_LEVEL=INFO
    volumes:
      - ./app:/app/app
      - ./data:/app/data
    depends_on:
      - chromadb
    networks:
      - enterprise-kb-network
    restart: unless-stopped

  # ChromaDB Vector Database Service
  chromadb:
    image: chromadb/chroma:latest
    container_name: enterprise-kb-chromadb
    ports:
      - "8001:8000"
    environment:
      - IS_PERSISTENT=true
    volumes:
      - chroma_data:/chroma/data
    networks:
      - enterprise-kb-network
    restart: unless-stopped

networks:
  enterprise-kb-network:
    driver: bridge

volumes:
  chroma_data:
