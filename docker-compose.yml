version: '3.8'

services:
  # ── FastAPI Backend ─────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ekb-backend
    ports:
      - "8000:8000"
    env_file:
      - .env                         # GROQ_API_KEY, ALLOWED_ORIGINS, etc.
    environment:
      - ALLOWED_ORIGINS=http://localhost:8501
      - CHROMA_PATH=/app/chroma_data
    volumes:
      - chroma_data:/app/chroma_data # Persistent vector DB
      - ./data:/app/data             # Uploaded documents
    networks:
      - ekb-network
    restart: unless-stopped
    mem_limit: 6g
    cpus: "2.0"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── Streamlit Frontend ──────────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: ekb-frontend
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - API_BASE_URL=http://backend:8000  # Internal service-name resolution
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - ekb-network
    restart: unless-stopped
    mem_limit: 512m

volumes:
  chroma_data:                         # Named volume → survives container restarts

networks:
  ekb-network:
    driver: bridge